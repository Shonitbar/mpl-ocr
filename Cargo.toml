[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
mapleocr-capture = { path = "crates/mapleocr-capture" }
mapleocr-imgproc = { path = "crates/mapleocr-imgproc" }
mapleocr-layout = { path = "crates/mapleocr-layout" }
mapleocr-recog = { path = "crates/mapleocr-recog" }
mapleocr-semantic = { path = "crates/mapleocr-semantic" }
mapleocr-core = { path = "crates/mapleocr-core" }
mapleocr-server = { path = "crates/mapleocr-server" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
png = "0.18"
ctrlc = "3"
dirs = "7"
criterion = "0.8"
windows = "0.62"
serde_norway = "0.9"
arc-swap = "1"
crossbeam-channel = "0.5"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
futures-util = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
