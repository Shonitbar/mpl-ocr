<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mpl-ocr live</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --fg:#14171a; --dim:#6b7280; --line:#e3e6ea; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1a1f26; --fg:#e8eaed; --dim:#8b95a1; --line:#2a313a; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,sans-serif; padding:16px 20px 40px; }
  h1 { font-size:16px; margin:0 0 4px; } #st { color:var(--dim); margin-bottom:14px; font-size:13px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
  .c { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .c.hidden { opacity:.45 }
  .n { color:var(--dim); font-size:12px; display:flex; justify-content:space-between; }
  .v { font-size:18px; font-weight:600; margin:4px 0; word-break:break-word; white-space:pre-wrap; }
  .v.small { font-size:13px; font-weight:400; }
  .m { color:var(--dim); font-size:12px; } .lo { color:var(--warn) } .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:6px 0 }
  .bar i { display:block; height:100%; background:var(--ok); }
</style>
<h1>mpl-ocr <span id="dot">●</span></h1>
<div id="st">connecting…</div>
<div id="grid"></div>
<script>
const grid = document.getElementById('grid'), st = document.getElementById('st'), dot = document.getElementById('dot');
const cards = {};
function show(v) {
  switch (v.type) {
    case 'map': return [`${v.region ? v.region + ' / ' : ''}${v.name}`];
    case 'ratio': return [`${v.current} / ${v.max}`, v.max ? v.current / v.max : null];
    case 'exp': return [`${v.value.toLocaleString()}  (${(+v.percent).toFixed(2)}%)`, v.percent / 100];
    case 'number': return [v.value.toLocaleString()];
    case 'text': return [v.text || '—', null, true];
    case 'lines': return [v.lines.map(l => l.text).join('\n') || '—', null, true];
    case 'dialogue': return [v.text + (v.options.length ? '\n\n▸ ' + v.options.join('\n▸ ') : ''), null, true];
    case 'tooltips': return [v.items.map(t => t.name + '\n' + t.lines.join('\n')).join('\n\n'), null, true];
    case 'window': return [Object.entries(v.fields).map(([k, x]) => k + ': ' + show(x)[0]).join('\n') + `\n${v.slots.length} item slots`, null, true];
    case 'damage': return [v.hits.map(h => h.text).join('  '), null, false];
    case 'hidden': return ['not on screen'];
    case 'empty': return ['—'];
    default: return [JSON.stringify(v), null, true];
  }
}
function render(r) {
  let c = cards[r.roi];
  if (!c) {
    c = cards[r.roi] = document.createElement('div'); c.className = 'c';
    c.innerHTML = '<div class="n"><b></b><span></span></div><div class="v"></div><div class="bar" hidden><i></i></div><div class="m"></div>';
    grid.append(c);
    [...grid.children].sort((a, b) => a.firstChild.firstChild.textContent.localeCompare(b.firstChild.firstChild.textContent)).forEach(x => grid.append(x));
  }
  const [text, frac, small] = show(r.value);
  c.classList.toggle('hidden', r.value.type === 'hidden');
  c.querySelector('b').textContent = r.roi;
  c.querySelector('.n span').textContent = r.engine;
  const v = c.querySelector('.v'); v.textContent = text; v.classList.toggle('small', !!small);
  const bar = c.querySelector('.bar'); bar.hidden = frac == null; if (frac != null) bar.firstChild.style.width = Math.max(0, Math.min(1, frac)) * 100 + '%';
  const lat = ((r.published_at - r.captured_at) / 1e4).toFixed(1);
  c.querySelector('.m').innerHTML = `confidence <span class="${r.confidence < .6 ? 'lo' : ''}">${r.confidence.toFixed(2)}</span> · read ${r.ms.toFixed(1)} ms · capture→publish ${lat} ms`;
}
async function status() {
  try { const s = await (await fetch('/v1/status')).json();
    st.textContent = `${s.target} via ${s.backend} · ${s.client_size ? s.client_size.join('×') : '?'} · UI ×${s.ui_scale ? s.ui_scale.toFixed(3) : '?'} · ${s.frames} frames` + (s.last_error ? ' · ' + s.last_error : '');
  } catch { st.textContent = 'server not reachable'; }
}
function connect() {
  const ws = new WebSocket(`ws://${location.host}/v1/stream`);
  ws.onopen = () => { dot.style.color = 'var(--ok)'; status(); };
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'reading') render(m.reading); };
  ws.onclose = () => { dot.style.color = 'var(--bad)'; setTimeout(connect, 1000); };
}
connect(); setInterval(status, 2000);
</script>
