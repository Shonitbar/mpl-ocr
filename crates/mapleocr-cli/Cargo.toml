[package]
name = "mapleocr-cli"
description = "Command-line tools for mpl-ocr: target selection, dataset capture, benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mapleocr"
path = "src/main.rs"

[dependencies]
mapleocr-capture.workspace = true
mapleocr-core.workspace = true
mapleocr-imgproc.workspace = true
mapleocr-layout.workspace = true
mapleocr-semantic.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
png.workspace = true
ctrlc.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
