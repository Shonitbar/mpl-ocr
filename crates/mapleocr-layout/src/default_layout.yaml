# Default layout for MapleStory Classic World.
#
# Coordinates are native UI units: the client draws its UI on a canvas
# `canvas_height` lines tall and stretches it to the window, so
# scale = client height / canvas_height (measured: 1200 / 768 = 1.5625).
#
# Anchors are UI landmarks found by template matching at calibration time.
# Their templates are cut from the user's own screen on first run; none ship.
# ROI rects are relative to their anchor's top-left.
schema: mapleocr.layout/1
canvas_height: 768

anchors:
  client:                   # the whole client area; never template-matched
    origin: top_left
    rect: [0, 0, 1, 1]
    fixed: true
  minimap_caption:          # "MINI MAP" caption in the minimap title bar
    origin: top_left
    rect: [6, 7, 46, 11]
    search: [0, 0, 420, 260]
  quest_helper_caption:     # "Quest Helper (n/n)" caption, top right
    origin: top_right
    rect: [-280.3, 49.9, 44.8, 12.8]
  npc_dialogue:             # left border of the NPC dialogue window (only open while talking)
    origin: top_center
    rect: [-236.8, 275.2, 9, 153.6]
    optional: true
  status_lv:                # "LV." label at the left end of the bottom status bar
    origin: bottom_center
    rect: [-390.4, -26.9, 26.9, 19.2]

rois:
  map_name:                 # two lines: region ("Victoria Road") and map ("Henesys Market")
    anchor: minimap_caption
    rect: [42, 20, 400, 32]
    recognizer: ocr
    key: white              # white text with a drop shadow
    crop: panel             # minimap width varies; stop at the panel's right edge
    parse: map_name
    settle_frames: 2        # map changes fade; wait until pixels are stable

  # Bottom status bar: sprite digits and 1-bit Arial, read by the glyph tier
  # on the native grid. Sprite atlases are learned from your own captures
  # (`mapleocr atlas learn`); until then these ROIs fall back to OCR.
  level:                    # white digits in orange boxes
    anchor: status_lv
    rect: [32, -1.3, 30.7, 19.2]
    recognizer: glyph
    font: learned:status_level
    key: white
    parse: int
  job:
    anchor: status_lv
    rect: [69, -4.5, 101, 12.5]
    recognizer: glyph
    font: gdi:Arial:12
  character_name:
    anchor: status_lv
    rect: [69, 9.5, 101, 11]
    recognizer: glyph
    font: gdi:Arial:12
  hp:                       # "[544/554]"
    anchor: status_lv
    rect: [227.5, -5, 53, 13]
    recognizer: glyph
    font: learned:status_digits
    parse: ratio
  mp:                       # "[104/448]"
    anchor: status_lv
    rect: [337, -5, 55.5, 13]
    recognizer: glyph
    font: learned:status_digits
    parse: ratio
  exp:                      # "554 [7.86%]"
    anchor: status_lv
    rect: [454, -5, 100, 13]
    recognizer: glyph
    font: learned:status_digits
    parse: exp

  # Every text line on screen with its box: the universal fallback, so any
  # UI text is readable even without a dedicated ROI. Slow (full-frame OCR),
  # so it is opt-in: subscribe to it explicitly.
  screen:
    anchor: client
    rect: [0, 0, 1600, 768]
    recognizer: ocr
    key: raw
    parse: lines
    settle_frames: 3
    opt_in: true

  # Chat log above the status bar (default size). Colored lines over
  # translucent backgrounds: OCR on raw pixels, one entry per line.
  chat:
    anchor: status_lv
    rect: [-6.4, -107.5, 547.2, 67.2]
    recognizer: ocr
    key: raw
    parse: lines
    min_interval_ms: 500      # translucent: pixels change every frame

  # Quest helper: dark Arial 11 (titles bold) on a light translucent panel.
  quest_helper:
    anchor: quest_helper_caption
    rect: [1.3, 16.6, 218.2, 330]
    recognizer: glyph
    font: gdi:Arial:11+gdi:Arial:11:bold
    key: "#000000"            # black text; the panel is translucent over the world
    parse: lines
    min_interval_ms: 500

  # NPC dialogue: read only while the window is open (presence anchor).
  npc_name:                 # white on a navy plate under the portrait (height varies)
    anchor: npc_dialogue
    rect: [14.1, 70.4, 120.3, 76.8]
    recognizer: glyph
    font: gdi:Arial:11
    crop: "band:#223355"
  npc_dialogue:
    anchor: npc_dialogue
    rect: [147.2, 6.4, 361.6, 172.8]
    recognizer: glyph
    font: gdi:Arial:12
    key: dark
    parse: dialogue

# UI without a fixed position, found on low-rate full-frame scout captures.
detectors:
  tooltip:                  # item tooltips (translucent navy boxes)
    kind: tooltip
    font: gdi:Arial:12+gdi:Arial:12:bold+gdi:Arial:14:bold+gdi:Arial:13:bold
  item_inventory:           # learn the title once: mapleocr window learn item_inventory_title ...
    kind: window
    template: item_inventory_title
    grid:                   # 5 x 6 item slots
      origin: [8.3, 48.6]
      pitch: [35.84, 34.56]
      size: [32, 30.7]
      cols: 5
      rows: 6
      quantity_font: learned:slot_digits
    fields:
      mesos:
        rect: [35, 262, 131, 17]
        recognizer: ocr
        key: dark
        parse: digits
  damage:                   # floating damage numbers (learned:damage_digits)
    kind: damage
    font: learned:damage_digits
